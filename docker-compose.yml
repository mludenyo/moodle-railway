services:

  db:
    image: mysql:8.4
    container_name: moodle_db
    restart: unless-stopped
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --mysql-native-password=ON
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodleuser
      MYSQL_PASSWORD: moodlepassword
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - moodle_net

  moodle:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moodle_app
    restart: unless-stopped
    depends_on:
      - db
    environment:
      MOODLE_DB_HOST: db
      MOODLE_DB_PORT: 3306
      MOODLE_DB_NAME: moodle
      MOODLE_DB_USER: moodleuser
      MOODLE_DB_PASSWORD: moodlepassword
      MOODLE_WWWROOT: http://localhost:8080
      MOODLE_SITE_FULLNAME: My Moodle Site
      MOODLE_SITE_SHORTNAME: moodle
      MOODLE_SITE_SUMMARY: Welcome to Moodle
      MOODLE_ADMIN_USER: admin
      MOODLE_ADMIN_PASSWORD: Admin1234!
      MOODLE_ADMIN_EMAIL: admin@example.com
    volumes:
      - moodledata:/var/moodledata
    ports:
      - "8080:80"
    networks:
      - moodle_net

volumes:
  db_data:
    driver: local
  moodledata:
    driver: local

networks:
  moodle_net:
    driver: bridge